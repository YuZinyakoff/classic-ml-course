<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Восемь обучающих и два тестовых объекта</title>
  <desc id="desc">Десять объектов расположены в один ряд. Первые восемь синих объектов образуют обучающую выборку, последние два оранжевых объекта отделены вертикальной чертой и образуют тестовую выборку.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
    .heading { font-size: 28px; font-weight: 700; }
    .label { font-size: 20px; font-weight: 700; }
    .train { fill: #2864dc; }
    .test { fill: #d97022; }
    .note { font-size: 16px; fill: #66758b; }
  </style>
  <rect width="1100" height="260" fill="#ffffff"/>
  <text x="50" y="45" class="heading">Часть исторических объектов временно играет роль новых</text>
  <g fill="#2864dc" stroke="#ffffff" stroke-width="4">
    <circle cx="95" cy="120" r="25"/>
    <circle cx="190" cy="120" r="25"/>
    <circle cx="285" cy="120" r="25"/>
    <circle cx="380" cy="120" r="25"/>
    <circle cx="475" cy="120" r="25"/>
    <circle cx="570" cy="120" r="25"/>
    <circle cx="665" cy="120" r="25"/>
    <circle cx="760" cy="120" r="25"/>
  </g>
  <line x1="820" y1="78" x2="820" y2="164" stroke="#172033" stroke-width="4"/>
  <g fill="#d97022" stroke="#ffffff" stroke-width="4">
    <circle cx="890" cy="120" r="25"/>
    <circle cx="985" cy="120" r="25"/>
  </g>
  <text x="428" y="198" text-anchor="middle" class="label train">train — 8 объектов (80%)</text>
  <text x="938" y="198" text-anchor="middle" class="label test">test — 2 объекта (20%)</text>
  <text x="550" y="236" text-anchor="middle" class="note">80/20 — только наглядный пример, универсальной доли нет</text>
</svg>
