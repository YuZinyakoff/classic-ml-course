name: Deploy course slides to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: presentation/.node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Slidev dependencies
        working-directory: presentation
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare landing page and downloadable PDF
        run: |
          mkdir -p .pages/bachelors/2026/week-01
          cp -R site/. .pages/
          cp bachelors/2026/week-01/lecture/slides.pdf .pages/bachelors/2026/week-01/slides.pdf

      - name: Build Week 1 Slidev deck
        working-directory: presentation
        run: >-
          pnpm exec slidev build decks/week-01.md
          --without-notes
          --base /classic-ml-course/bachelors/2026/week-01/slides/
          --out ${{ github.workspace }}/.pages/bachelors/2026/week-01/slides

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
